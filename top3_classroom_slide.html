<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top 3 Students</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --gold: #f59e0b;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, #1d4ed8 0%, var(--bg-1) 40%, #020617 100%);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 2rem;
    }

    .slide {
      width: min(1000px, 100%);
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(2, 6, 23, 0.5);
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.04em;
      color: #e2e8f0;
    }

    .header p {
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      align-items: end;
    }

    .card {
      position: relative;
      border-radius: 18px;
      padding: 1.2rem 1rem 1rem;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(3px);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .rank {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      letter-spacing: 0.02em;
    }

    .student-name {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .points {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #e2e8f0;
    }

    .points strong {
      color: var(--accent);
      font-size: 1.3rem;
      margin-inline: 0.25rem;
    }

    .first {
      min-height: 300px;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.18), rgba(30, 41, 59, 0.45));
    }

    .first .rank {
      background: rgba(245, 158, 11, 0.2);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.6);
    }

    .second {
      min-height: 250px;
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.16), rgba(30, 41, 59, 0.45));
    }

    .second .rank {
      background: rgba(203, 213, 225, 0.2);
      color: #e2e8f0;
      border: 1px solid rgba(203, 213, 225, 0.55);
    }

    .third {
      min-height: 220px;
      background: linear-gradient(180deg, rgba(217, 119, 6, 0.16), rgba(30, 41, 59, 0.45));
    }

    .third .rank {
      background: rgba(217, 119, 6, 0.2);
      color: #fed7aa;
      border: 1px solid rgba(217, 119, 6, 0.55);
    }

    .footer {
      margin-top: 1.4rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 800px) {
      .podium {
        grid-template-columns: 1fr;
      }

      .first,
      .second,
      .third {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <section class="slide">
    <header class="header">
      <h1>🏆 Top 3 Students</h1>
      <p>Congratulations to our highest-achieving students this term!</p>
    </header>

    <div class="podium">
      <article class="card second">
        <span class="rank">2nd Place</span>
        <h2 class="student-name">Liam Johnson</h2>
        <p class="points">Points: <strong>940</strong></p>
      </article>

      <article class="card first">
        <span class="rank">1st Place</span>
        <h2 class="student-name">Emma Williams</h2>
        <p class="points">Points: <strong>980</strong></p>
      </article>

      <article class="card third">
        <span class="rank">3rd Place</span>
        <h2 class="student-name">Noah Brown</h2>
        <p class="points">Points: <strong>910</strong></p>
      </article>
    </div>

    <p class="footer">Keep up the amazing work — every point is a step toward success.</p>
  </section>
</body>
</html>
